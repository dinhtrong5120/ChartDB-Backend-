services:
  app-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: chartdb
      MYSQL_USER: chartdb
      MYSQL_PASSWORD: chartdb
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - app-db-data:/var/lib/mysql

  source-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: chartdb_source
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - source-db-data:/var/lib/mysql
      - ./docker/source-init.sql:/docker-entrypoint-initdb.d/source-init.sql:ro

  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      app-db:
        condition: service_healthy

volumes:
  app-db-data:
  source-db-data:

